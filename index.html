<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBEMATEX — WebGIS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; }

    /* ── LAYOUT ─────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── HEADER ─────────────────────────────────── */
    #header {
      background: #0d1b2a; color: #e0f2f1; height: 50px;
      display: flex; align-items: center; padding: 0 14px; gap: 10px;
      flex-shrink: 0; z-index: 1000; box-shadow: 0 2px 10px rgba(0,0,0,.5);
    }
    .hdr-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg,#2e7d32,#43a047);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-size: 15px; flex-shrink: 0;
    }
    .hdr-title h1 { font-size: 15px; font-weight: 700; }
    .hdr-title small { font-size: 9px; color: #546e7a; text-transform: uppercase; letter-spacing: 1px; display: block; }
    .hdr-spacer { flex: 1; }
    #hdr-status { font-size: 11px; color: #546e7a; }
    #hdr-fit-btn {
      background: #1e3a5f; border: 1px solid #1a5276; color: #90caf9;
      padding: 5px 11px; border-radius: 5px; cursor: pointer; font-size: 11px;
      display: flex; align-items: center; gap: 5px; transition: background .2s;
    }
    #hdr-fit-btn:hover { background: #1a4a7a; }

    /* ── MAIN ───────────────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ────────────────────────────────── */
    #sidebar {
      width: 282px; background: #1a2533;
      display: flex; flex-direction: column; flex-shrink: 0;
      overflow: hidden; z-index: 500;
      transition: width .28s cubic-bezier(.4,0,.2,1);
      box-shadow: 3px 0 10px rgba(0,0,0,.35);
    }
    #sidebar.collapsed { width: 0; }

    .sb-head {
      padding: 11px 14px 9px; background: #151e2b;
      border-bottom: 1px solid #243447; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .sb-head h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #546e7a; font-weight: 700; }

    /* basemaps */
    .sb-section { border-bottom: 1px solid #1e2e40; flex-shrink: 0; }
    .sb-section-title {
      padding: 9px 14px 6px; font-size: 9.5px; text-transform: uppercase;
      letter-spacing: 1.5px; color: #455a64; font-weight: 700;
    }
    .bm-list { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 3px; }
    .bm-opt {
      display: flex; align-items: center; gap: 9px; padding: 6px 9px;
      border-radius: 6px; cursor: pointer; color: #90a4ae; font-size: 11.5px;
      transition: background .15s, color .15s; user-select: none;
    }
    .bm-opt:hover { background: #1e2e40; }
    .bm-opt.active { background: #1a3a5c; color: #64b5f6; }
    .bm-thumb { width: 26px; height: 18px; border-radius: 3px; border: 1px solid #37474f; flex-shrink: 0; }

    /* layer scroll area */
    .layers-header {
      padding: 9px 14px 5px; font-size: 9.5px; text-transform: uppercase;
      letter-spacing: 1.5px; color: #455a64; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; border-bottom: 1px solid #1e2e40;
    }
    #layer-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
    #layer-list::-webkit-scrollbar { width: 4px; }
    #layer-list::-webkit-scrollbar-track { background: #1a2533; }
    #layer-list::-webkit-scrollbar-thumb { background: #2e4057; border-radius: 2px; }

    /* ── GROUP ROW ───────────────────────────────── */
    .group-block { border-bottom: 1px solid #1e2e40; }

    .group-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px 7px 10px; cursor: default;
      background: #1a2533; transition: background .12s;
    }
    .group-row:hover { background: #1c2a3a; }

    .grp-expand {
      color: #455a64; font-size: 10px; cursor: pointer; width: 14px;
      flex-shrink: 0; transition: transform .2s, color .15s; text-align: center;
    }
    .grp-expand:hover { color: #90a4ae; }
    .grp-expand.open { transform: rotate(90deg); }

    .grp-toggle { /* master toggle */
      width: 30px; height: 16px; background: #37474f; border-radius: 8px;
      position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s;
    }
    .grp-toggle::after {
      content:''; position:absolute; top:2px; left:2px;
      width:12px; height:12px; background:#fff; border-radius:50%; transition:transform .2s;
    }
    .grp-toggle.on { background: #2e7d32; }
    .grp-toggle.on::after { transform: translateX(14px); }

    .grp-icon { font-size: 11px; color: #455a64; flex-shrink: 0; }
    .grp-name { flex: 1; color: #b0bec5; font-size: 12px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grp-count { font-size: 9px; color: #37474f; }

    /* ── SUB-LAYER ROW ───────────────────────────── */
    .sub-layers { display: none; }
    .sub-layers.open { display: block; }

    .sub-row {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 12px 5px 36px; transition: background .12s;
    }
    .sub-row:hover { background: #1e2e40; }
    .sub-row.sl-hidden { opacity: .35; }

    .sl-toggle {
      width: 26px; height: 14px; background: #37474f; border-radius: 7px;
      position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s;
    }
    .sl-toggle::after {
      content:''; position:absolute; top:1px; left:1px;
      width:12px; height:12px; background:#fff; border-radius:50%; transition:transform .2s;
    }
    .sl-toggle.on { background: #2e7d32; }
    .sl-toggle.on::after { transform: translateX(12px); }

    .sl-swatch {
      width: 13px; height: 13px; border-radius: 3px;
      border: 1.5px solid rgba(255,255,255,.2); flex-shrink: 0;
      cursor: pointer; position: relative;
      transition: transform .15s, box-shadow .15s;
    }
    .sl-swatch:hover { transform: scale(1.2); box-shadow: 0 0 0 2px rgba(100,181,246,.5); }

    .sl-name {
      flex: 1; color: #cfd8dc; font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sl-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .sl-btn {
      color: #37474f; font-size: 10px; padding: 3px 4px;
      border-radius: 3px; cursor: pointer; transition: color .15s, background .15s;
    }
    .sl-btn:hover { color: #64b5f6; background: #243447; }

    /* ── STYLE EDITOR PANEL ──────────────────────── */
    .style-panel {
      display: none; background: #131e2b;
      border-top: 1px solid #1e2e40; padding: 10px 12px 10px 36px;
    }
    .style-panel.open { display: block; }

    .sp-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
    }
    .sp-row:last-child { margin-bottom: 0; }
    .sp-label { font-size: 10px; color: #546e7a; width: 58px; flex-shrink: 0; }

    /* native color input styled as a square button */
    .sp-color {
      width: 28px; height: 22px; border: 1px solid #37474f; border-radius: 4px;
      padding: 1px 2px; background: #1a2533; cursor: pointer; flex-shrink: 0;
    }
    .sp-color::-webkit-color-swatch-wrapper { padding: 0; }
    .sp-color::-webkit-color-swatch { border: none; border-radius: 2px; }

    /* opacity / weight sliders */
    .sp-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; background: #2e4057; border-radius: 2px; outline: none; cursor: pointer;
    }
    .sp-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 13px; height: 13px;
      border-radius: 50%; background: #64b5f6; cursor: pointer;
      border: 2px solid #1a2533;
    }
    .sp-val { font-size: 10px; color: #546e7a; width: 32px; text-align: right; flex-shrink: 0; }

    /* ── NO LAYERS ───────────────────────────────── */
    #no-layers-msg {
      padding: 24px 14px; color: #37474f; font-size: 11px;
      text-align: center; line-height: 1.8;
    }
    #no-layers-msg code { background: #151e2b; padding: 1px 5px; border-radius: 3px; }

    /* loading row */
    .lyr-loading { padding: 7px 14px; color: #37474f; font-size: 11px; display: flex; align-items: center; gap: 7px; }
    .spin-sm { width:12px; height:12px; border:2px solid #2e4057; border-top-color:#64b5f6;
      border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MAP WRAPPER ─────────────────────────────── */
    #map-wrap { flex: 1; display: flex; position: relative; overflow: hidden; }

    #sb-toggle {
      position: absolute; top: 50%; left: 0; transform: translateY(-50%);
      z-index: 600; background: #1a2533; border: none; color: #546e7a;
      width: 18px; height: 44px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 0 5px 5px 0; font-size: 9px;
      box-shadow: 2px 0 5px rgba(0,0,0,.4); transition: background .2s, color .2s;
    }
    #sb-toggle:hover { background: #1e2e40; color: #64b5f6; }

    #map { flex: 1; }

    #coords {
      position: absolute; bottom: 22px; left: 10px;
      background: rgba(13,27,42,.82); color: #546e7a;
      font-size: 10px; padding: 3px 8px; border-radius: 4px;
      z-index: 400; font-family: 'Courier New', monospace; pointer-events: none;
    }

    /* ── LEAFLET OVERRIDES ───────────────────────── */
    .leaflet-control-zoom { border: none !important; box-shadow: 0 2px 8px rgba(0,0,0,.4) !important; }
    .leaflet-control-zoom a {
      background: #1a2533 !important; color: #78909c !important;
      border-color: #243447 !important; width: 30px !important; height: 30px !important;
      line-height: 28px !important; font-size: 16px !important; font-weight: 400 !important;
      transition: background .15s, color .15s !important;
    }
    .leaflet-control-zoom a:hover { background: #243447 !important; color: #64b5f6 !important; }
    .leaflet-control-scale-line {
      background: rgba(13,27,42,.8) !important; color: #78909c !important;
      border-color: #455a64 !important; border-top-color: #455a64 !important; font-size: 10px !important;
    }
    .leaflet-bar { border: none !important; }

    .leaflet-popup-content-wrapper {
      background: #1a2533; color: #cfd8dc; border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); border: 1px solid #243447;
    }
    .leaflet-popup-tip { background: #1a2533; }
    .leaflet-popup-content { margin: 10px 14px; font-size: 11.5px; }
    .pop-title { font-size: 12px; color: #64b5f6; font-weight: 600; margin-bottom: 7px;
      border-bottom: 1px solid #243447; padding-bottom: 5px; }
    .pop-table { width: 100%; border-collapse: collapse; }
    .pop-table td { padding: 3px 4px; border-bottom: 1px solid #1e2e40; }
    .pop-table td:first-child { color: #78909c; white-space: nowrap; padding-right: 10px; }
    .pop-table td:last-child { color: #e0f2f1; word-break: break-word; max-width: 200px; }

    /* ── LOADING OVERLAY ─────────────────────────── */
    #loading {
      position: fixed; inset: 0; background: rgba(10,18,28,.92);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 9999; color: #cfd8dc; gap: 14px;
    }
    .spin-lg { width:42px; height:42px; border:3px solid rgba(255,255,255,.12);
      border-top-color:#64b5f6; border-radius:50%; animation:spin .75s linear infinite; }
    #loading-msg { font-size: 13px; color: #78909c; }

    /* ── TOAST ───────────────────────────────────── */
    #toast-box { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 9998; }
    .toast { background: #b71c1c; color: #fff; padding: 9px 14px; border-radius: 6px;
      font-size: 11.5px; max-width: 320px; box-shadow: 0 3px 10px rgba(0,0,0,.4);
      animation: fadeIn .3s ease; }
    .toast.warn { background: #e65100; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spin-lg"></div>
  <div id="loading-msg">Carregando WebGIS…</div>
</div>

<div id="app">
  <!-- HEADER -->
  <div id="header">
    <div class="hdr-logo">🌿</div>
    <div class="hdr-title">
      <h1>DBEMATEX</h1>
      <small>Sistema WebGIS Ambiental</small>
    </div>
    <div class="hdr-spacer"></div>
    <button id="hdr-fit-btn" onclick="fitAll()">
      <i class="fa-solid fa-expand"></i> Ajustar Mapa
    </button>
    <div id="hdr-status">Aguardando…</div>
  </div>

  <div id="main">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sb-head">
        <i class="fa-solid fa-layer-group" style="color:#455a64;font-size:12px"></i>
        <h3>Painel de Camadas</h3>
      </div>

      <!-- Basemaps -->
      <div class="sb-section">
        <div class="sb-section-title">Mapa Base</div>
        <div class="bm-list">
          <div class="bm-opt active" onclick="setBasemap('osm',this)">
            <div class="bm-thumb" style="background:linear-gradient(135deg,#b8d8b4,#85c1d0)"></div>OpenStreetMap
          </div>
          <div class="bm-opt" onclick="setBasemap('esri-sat',this)">
            <div class="bm-thumb" style="background:linear-gradient(135deg,#2c3e2d,#3d6148)"></div>Satélite (ESRI)
          </div>
          <div class="bm-opt" onclick="setBasemap('esri-topo',this)">
            <div class="bm-thumb" style="background:linear-gradient(135deg,#d4c5a9,#a5b89a)"></div>Topográfico (ESRI)
          </div>
          <div class="bm-opt" onclick="setBasemap('google-sat',this)">
            <div class="bm-thumb" style="background:linear-gradient(135deg,#1a3318,#2d5e2d)"></div>Google Satélite
          </div>
        </div>
      </div>

      <!-- Layers -->
      <div class="layers-header">
        <span>Feições <span id="lyr-count" style="color:#37474f;font-weight:400"></span></span>
      </div>
      <div id="layer-list">
        <div id="no-layers-msg">
          <div style="font-size:26px;margin-bottom:8px">📂</div>
          Nenhuma camada carregada.<br>
          Adicione ZIPs em <code>data/</code> e<br>execute <code>gerar_catalog.py</code>.
        </div>
      </div>
    </div>

    <!-- MAP -->
    <div id="map-wrap">
      <button id="sb-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-chevron-left" id="sb-icon"></i>
      </button>
      <div id="map"></div>
      <div id="coords">Lat: —  &nbsp; Lon: —</div>
    </div>
  </div>
</div>
<div id="toast-box"></div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.js"></script>

<script>
'use strict';

/* ── ESTILOS PADRÃO (match por substring no nome da feição) ─── */
const STYLES = {
  limite_imovel: { color:'#000000', weight:2.5, fillOpacity:0,    opacity:1 },
  limite:        { color:'#000000', weight:2.5, fillOpacity:0,    opacity:1 },
  reserva_legal: { color:'#1b5e20', weight:1.5, fillColor:'#4CAF50', fillOpacity:0.50 },
  reserva:       { color:'#1b5e20', weight:1.5, fillColor:'#4CAF50', fillOpacity:0.50 },
  consolidado:   { color:'#4a148c', weight:1.5, fillColor:'#ce93d8', fillOpacity:0.40 },
  app:           { color:'#0d47a1', weight:1.5, fillColor:'#42A5F5', fillOpacity:0.45 },
  area_app:      { color:'#0d47a1', weight:1.5, fillColor:'#42A5F5', fillOpacity:0.45 },
  hidrografia:   { color:'#01579b', weight:1.5, fillColor:'#29b6f6', fillOpacity:0.50 },
  curso_dagua:   { color:'#0277bd', weight:2.0, fillOpacity:0,    opacity:1 },
  corpo_dagua:   { color:'#01579b', weight:1.5, fillColor:'#29b6f6', fillOpacity:0.45 },
  uso_solo:      { color:'#424242', weight:1.0, fillColor:'#FFC107', fillOpacity:0.40 },
  uso:           { color:'#424242', weight:1.0, fillColor:'#FFC107', fillOpacity:0.40 },
  servidao:      { color:'#bf360c', weight:1.5, fillColor:'#FF7043', fillOpacity:0.40, dashArray:'6,4' },
  vegetacao:     { color:'#33691e', weight:1.0, fillColor:'#8BC34A', fillOpacity:0.45 },
  edificacao:    { color:'#37474f', weight:1.0, fillColor:'#90A4AE', fillOpacity:0.70 },
  estrada:       { color:'#795548', weight:2.5, fillOpacity:0,    opacity:1 },
  via:           { color:'#795548', weight:2.0, fillOpacity:0,    opacity:1 },
  default:       { color:'#3388ff', weight:1.5, fillColor:'#3388ff', fillOpacity:0.30 },
};

/* paleta de cores automática para sub-camadas sem estilo definido */
const AUTO_PALETTE = [
  '#e53935','#8e24aa','#1e88e5','#00897b','#f4511e',
  '#6d4c41','#546e7a','#c0ca33','#fdd835','#00acc1',
];

let map;
const baseLayers = {};
let groups = [];      // array de grupos (um por entrada do catalog)
let sbOpen = true;
let autoColorIdx = 0;

/* ── MAPA ─────────────────────────────────────────────────── */
function initMap() {
  map = L.map('map', { zoomControl:false, center:[-15.8,-47.9], zoom:5, maxZoom:22, preferCanvas:true });
  L.control.zoom({ position:'topright' }).addTo(map);
  L.control.scale({ position:'bottomright', imperial:false }).addTo(map);

  baseLayers['osm']       = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'© OpenStreetMap', maxZoom:19 });
  baseLayers['esri-sat']  = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution:'© Esri', maxZoom:22 });
  baseLayers['esri-topo'] = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    { attribution:'© Esri', maxZoom:22 });
  baseLayers['google-sat']= L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    { subdomains:'0123', attribution:'© Google', maxZoom:22 });

  baseLayers['osm'].addTo(map);

  map.on('mousemove', e => {
    document.getElementById('coords').textContent =
      `Lat: ${e.latlng.lat.toFixed(6)}   Lon: ${e.latlng.lng.toFixed(6)}`;
  });
}

function setBasemap(name, el) {
  Object.values(baseLayers).forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
  baseLayers[name].addTo(map);
  baseLayers[name].bringToBack();
  document.querySelectorAll('.bm-opt').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
}

function toggleSidebar() {
  sbOpen = !sbOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sbOpen);
  document.getElementById('sb-icon').className = sbOpen
    ? 'fa-solid fa-chevron-left' : 'fa-solid fa-chevron-right';
  setTimeout(() => map.invalidateSize(), 300);
}

/* ── STYLE RESOLVER ──────────────────────────────────────── */
function resolveStyle(name, custom) {
  if (custom && Object.keys(custom).length > 0) return { ...STYLES.default, ...custom };
  const key = (name || '').toLowerCase().replace(/[\s\-\.]/g, '_');
  for (const [k, s] of Object.entries(STYLES)) {
    if (k !== 'default' && key.includes(k)) return { ...s };
  }
  // Auto-color para camadas desconhecidas
  const c = AUTO_PALETTE[autoColorIdx++ % AUTO_PALETTE.length];
  return { color: c, weight: 1.5, fillColor: c, fillOpacity: 0.35, opacity: 1 };
}

function styleToCSS(s) {
  const fill = s.fillOpacity > 0 ? (s.fillColor || s.color) : 'transparent';
  return `background:${fill};border:2px solid ${s.color};`;
}

/* ── CARREGA GRUPO (uma entrada do catalog.json) ─────────── */
async function loadGroup(cfg, gIdx) {
  const file = cfg.file;
  const ext  = file.split('.').pop().toLowerCase();

  let raw;
  if (ext === 'zip') {
    raw = await shp(file);
  } else if (ext === 'shp') {
    raw = await shp(file.slice(0, -4));
  } else {
    const r = await fetch(file);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    raw = await r.json();
  }

  // Normaliza para array de sub-layers
  const items = Array.isArray(raw) ? raw : [raw];

  const subLayers = items.map((fc, slIdx) => {
    // fileName é definido pelo shpjs quando o ZIP tem múltiplos shapes
    const slName  = fc.fileName || cfg.name;
    const style   = resolveStyle(slName, slIdx === 0 ? cfg.style : null);
    const visible = cfg.visible !== false;

    const leafletLayer = L.geoJSON(fc, {
      style: () => ({ ...style }),
      pointToLayer: (feat, ll) => L.circleMarker(ll, {
        radius: 6, fillColor: style.fillColor || style.color,
        color: style.color, weight: 1.5, opacity: 1,
        fillOpacity: style.fillOpacity > 0 ? style.fillOpacity : 0.8,
      }),
      onEachFeature: (feat, lyr) => {
        if (!feat.properties) return;
        const rows = Object.entries(feat.properties)
          .filter(([,v]) => v !== null && String(v).trim() !== '')
          .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
        if (rows) lyr.bindPopup(
          `<div class="pop-title">${slName}</div><table class="pop-table">${rows}</table>`,
          { maxWidth:320 });
      },
    });

    if (visible) leafletLayer.addTo(map);

    return { name: slName, leafletLayer, style: {...style}, visible, bounds: leafletLayer.getBounds() };
  });

  return { cfg, subLayers, expanded: true, visible: cfg.visible !== false };
}

/* ── CONSTRÓI BLOCO NO PAINEL ────────────────────────────── */
function buildGroupBlock(g, gIdx) {
  const block = document.createElement('div');
  block.className = 'group-block';
  block.id = `gb-${gIdx}`;

  const multiSub = g.subLayers.length > 1;

  /* group row */
  const grpRow = document.createElement('div');
  grpRow.className = 'group-row';
  grpRow.innerHTML = `
    <span class="grp-expand ${multiSub ? 'open' : ''}" id="gexp-${gIdx}"
          onclick="${multiSub ? `toggleGroup(${gIdx})` : ''}"
          style="${multiSub ? '' : 'visibility:hidden'}">
      <i class="fa-solid fa-chevron-right"></i>
    </span>
    <div class="grp-toggle on" id="gtg-${gIdx}" onclick="toggleGroupVis(${gIdx})"
         title="Ligar/desligar tudo"></div>
    <i class="fa-solid fa-folder-open grp-icon"></i>
    <span class="grp-name" title="${g.cfg.name}">${g.cfg.name}</span>
    <span class="grp-count">${g.subLayers.length} feição${g.subLayers.length !== 1 ? 'ões' : ''}</span>
  `;
  block.appendChild(grpRow);

  /* sub-layers container */
  const subCont = document.createElement('div');
  subCont.className = `sub-layers${multiSub ? ' open' : ' open'}`; // always open initially
  subCont.id = `slc-${gIdx}`;

  g.subLayers.forEach((sl, slIdx) => {
    subCont.appendChild(buildSubRow(g, gIdx, sl, slIdx));
    subCont.appendChild(buildStylePanel(gIdx, slIdx, sl));
  });

  block.appendChild(subCont);
  return block;
}

function buildSubRow(g, gIdx, sl, slIdx) {
  const div = document.createElement('div');
  div.className = `sub-row${sl.visible ? '' : ' sl-hidden'}`;
  div.id = `sr-${gIdx}-${slIdx}`;

  const noFill = sl.style.fillOpacity === 0;
  const sw = noFill
    ? `background:transparent;border:2px solid ${sl.style.color};`
    : styleToCSS(sl.style);

  div.innerHTML = `
    <div class="sl-toggle on" id="stg-${gIdx}-${slIdx}"
         onclick="toggleSubLayer(${gIdx},${slIdx})"></div>
    <div class="sl-swatch" id="ssw-${gIdx}-${slIdx}" style="${sw}"
         onclick="toggleStylePanel(${gIdx},${slIdx})" title="Editar estilo"></div>
    <span class="sl-name" title="${sl.name}">${sl.name}</span>
    <div class="sl-actions">
      <span class="sl-btn" onclick="toggleStylePanel(${gIdx},${slIdx})" title="Editar estilo">
        <i class="fa-solid fa-palette"></i></span>
      <span class="sl-btn" onclick="zoomToSub(${gIdx},${slIdx})" title="Zoom">
        <i class="fa-solid fa-crosshairs"></i></span>
    </div>`;
  return div;
}

function buildStylePanel(gIdx, slIdx, sl) {
  const div = document.createElement('div');
  div.className = 'style-panel';
  div.id = `sp-${gIdx}-${slIdx}`;

  const fillColor = sl.style.fillColor || sl.style.color;
  const fillOpPct = Math.round((sl.style.fillOpacity || 0) * 100);
  const weight    = sl.style.weight || 1.5;

  div.innerHTML = `
    <div class="sp-row">
      <span class="sp-label">Borda</span>
      <input type="color" class="sp-color" id="sc-${gIdx}-${slIdx}"
             value="${sl.style.color}"
             oninput="applyStyle(${gIdx},${slIdx})">
      <span class="sp-label" style="width:auto;margin-left:6px">Espessura</span>
      <input type="range" class="sp-slider" id="sw-${gIdx}-${slIdx}"
             min="0.5" max="6" step="0.5" value="${weight}"
             oninput="applyStyle(${gIdx},${slIdx});document.getElementById('swv-${gIdx}-${slIdx}').textContent=this.value+'px'">
      <span class="sp-val" id="swv-${gIdx}-${slIdx}">${weight}px</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Preench.</span>
      <input type="color" class="sp-color" id="sfc-${gIdx}-${slIdx}"
             value="${fillColor}"
             oninput="applyStyle(${gIdx},${slIdx})">
      <span class="sp-label" style="width:auto;margin-left:6px">Opac.</span>
      <input type="range" class="sp-slider" id="so-${gIdx}-${slIdx}"
             min="0" max="100" value="${fillOpPct}"
             oninput="applyStyle(${gIdx},${slIdx});document.getElementById('sov-${gIdx}-${slIdx}').textContent=this.value+'%'">
      <span class="sp-val" id="sov-${gIdx}-${slIdx}">${fillOpPct}%</span>
    </div>`;
  return div;
}

/* ── INTERAÇÕES ──────────────────────────────────────────── */
function toggleGroup(gIdx) {
  const g    = groups[gIdx];
  g.expanded = !g.expanded;
  document.getElementById(`slc-${gIdx}`).classList.toggle('open', g.expanded);
  document.getElementById(`gexp-${gIdx}`).classList.toggle('open', g.expanded);
}

function toggleGroupVis(gIdx) {
  const g   = groups[gIdx];
  g.visible = !g.visible;
  document.getElementById(`gtg-${gIdx}`).classList.toggle('on', g.visible);
  g.subLayers.forEach((sl, slIdx) => {
    sl.visible = g.visible;
    if (g.visible) sl.leafletLayer.addTo(map);
    else map.removeLayer(sl.leafletLayer);
    document.getElementById(`stg-${gIdx}-${slIdx}`).classList.toggle('on', g.visible);
    document.getElementById(`sr-${gIdx}-${slIdx}`).classList.toggle('sl-hidden', !g.visible);
  });
}

function toggleSubLayer(gIdx, slIdx) {
  const sl  = groups[gIdx].subLayers[slIdx];
  sl.visible = !sl.visible;
  if (sl.visible) sl.leafletLayer.addTo(map);
  else map.removeLayer(sl.leafletLayer);
  document.getElementById(`stg-${gIdx}-${slIdx}`).classList.toggle('on', sl.visible);
  document.getElementById(`sr-${gIdx}-${slIdx}`).classList.toggle('sl-hidden', !sl.visible);
}

function toggleStylePanel(gIdx, slIdx) {
  const panel = document.getElementById(`sp-${gIdx}-${slIdx}`);
  panel.classList.toggle('open');
}

function applyStyle(gIdx, slIdx) {
  const sl      = groups[gIdx].subLayers[slIdx];
  const color   = document.getElementById(`sc-${gIdx}-${slIdx}`).value;
  const fill    = document.getElementById(`sfc-${gIdx}-${slIdx}`).value;
  const opacity = parseFloat(document.getElementById(`so-${gIdx}-${slIdx}`).value) / 100;
  const weight  = parseFloat(document.getElementById(`sw-${gIdx}-${slIdx}`).value);

  sl.style = { ...sl.style, color, fillColor: fill, fillOpacity: opacity, weight };
  sl.leafletLayer.setStyle({ color, fillColor: fill, fillOpacity: opacity, weight });

  // Atualiza swatch
  const sw = document.getElementById(`ssw-${gIdx}-${slIdx}`);
  sw.style.cssText = opacity > 0
    ? `background:${fill};border:2px solid ${color};`
    : `background:transparent;border:2px solid ${color};`;
}

function zoomToSub(gIdx, slIdx) {
  const sl = groups[gIdx].subLayers[slIdx];
  if (sl.bounds && sl.bounds.isValid())
    map.fitBounds(sl.bounds, { padding:[30,30], maxZoom:18 });
}

function fitAll() {
  const allBounds = groups.flatMap(g => g.subLayers)
    .filter(sl => sl.bounds && sl.bounds.isValid())
    .map(sl => sl.bounds);
  if (!allBounds.length) { toast('Nenhuma camada válida carregada.','warn'); return; }
  let combined = allBounds[0];
  allBounds.slice(1).forEach(b => { combined = combined.extend(b); });
  map.fitBounds(combined, { padding:[45,45], maxZoom:18 });
}

/* ── TOAST ───────────────────────────────────────────────── */
function toast(msg, type='error') {
  const el = document.createElement('div');
  el.className = `toast${type==='warn'?' warn':''}`;
  el.textContent = msg;
  document.getElementById('toast-box').appendChild(el);
  setTimeout(() => el.remove(), 5500);
}

/* ── MAIN ────────────────────────────────────────────────── */
async function main() {
  initMap();
  const loading    = document.getElementById('loading');
  const loadingMsg = document.getElementById('loading-msg');
  const layerList  = document.getElementById('layer-list');
  const noMsg      = document.getElementById('no-layers-msg');

  try {
    loadingMsg.textContent = 'Carregando catálogo…';
    const resp = await fetch('data/catalog.json');
    if (!resp.ok) throw new Error(`catalog.json não encontrado (HTTP ${resp.status})`);
    const catalog = await resp.json();

    const defs = catalog.layers || [];
    if (!defs.length) { document.getElementById('hdr-status').textContent = 'Sem camadas'; loading.style.display='none'; return; }

    noMsg.style.display = 'none';

    for (let i = 0; i < defs.length; i++) {
      const def = defs[i];

      // Spinner temporário
      const row = document.createElement('div');
      row.className = 'lyr-loading';
      row.innerHTML = `<div class="spin-sm"></div><span>Carregando ${def.name}…</span>`;
      layerList.appendChild(row);

      loadingMsg.textContent = `Carregando "${def.name}" (${i+1}/${defs.length})…`;

      try {
        const g = await loadGroup(def, i);
        groups.push(g);
        row.replaceWith(buildGroupBlock(g, i));
      } catch(err) {
        console.error(err);
        toast(`Erro: "${def.name}" — ${err.message}`);
        row.remove();
      }
    }

    const totalSub = groups.reduce((s, g) => s + g.subLayers.length, 0);
    document.getElementById('lyr-count').textContent = `(${totalSub})`;
    document.getElementById('hdr-status').textContent = `${groups.length} arquivo${groups.length!==1?'s':''}, ${totalSub} feição${totalSub!==1?'ões':''}`;

    fitAll();
  } catch(err) {
    console.error(err);
    document.getElementById('hdr-status').textContent = 'Erro ao carregar';
    if (err.message.includes('catalog.json')) {
      noMsg.innerHTML = `<div style="font-size:24px;margin-bottom:8px">⚠️</div>
        Abra com <code>python server.py</code><br>e crie o catálogo com<br><code>python gerar_catalog.py</code>`;
    } else toast(err.message);
  }

  loading.style.display = 'none';
}

document.addEventListener('DOMContentLoaded', main);
</script>
