name: Atualizar catálogo de camadas

# Dispara apenas quando arquivos de dados são enviados (ignora catalog.json para evitar loop)
on:
  push:
    paths:
      - 'data/**.zip'
      - 'data/**.geojson'
      - 'data/**.shp'
      - 'data/**.json'
  workflow_dispatch:   # permite rodar manualmente pelo site do GitHub

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # permissão para commitar o catalog.json

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar catalog.json
        run: python gerar_catalog.py

      - name: Commitar e fazer push do catalog.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --staged --quiet && echo "Sem mudanças no catálogo." || (
            git commit -m "🗺️ Auto: atualizar catalog.json"
            git push
          )
